<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HyperSheet</title>

    <link rel="stylesheet" href="/static/css/hypersheet.css">

    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
</head>

<body>

<div class="topbar">
    <div class="logo">
        <span>⌘</span>
        HyperSheet
    </div>

    <div class="title">
        Semantic Data Workspace
    </div>

    <div class="actions">
        ↶ ↷ 💾 Save &nbsp; 🔗 Share &nbsp; 👤
    </div>
</div>

<div class="menu">
    <div>File</div>
    <div>Edit</div>
    <div>View</div>
    <div>Insert</div>
    <div>Data</div>
    <div>Tools</div>
    <div>AI</div>
    <div onclick="window.location.href='/market-network'" style="cursor:pointer;">
        Market Network
    </div>
    <div>Help</div>
</div>

<div class="toolbar">
    <button class="btn" id="importExcelButton">
        Import Excel
    </button>

    <input
        type="file"
        id="excelFileInput"
        accept=".xlsx,.xlsm"
        style="display: none;"
    >

    <button class="btn">Explain</button>
    <button class="btn">Compare</button>
    <button class="btn">Forecast</button>
    <button class="btn">Dashboard</button>
    <button class="btn">Report</button>
</div>

<div class="main">

    <aside class="sidebar">
        <h3>Dimensions</h3>
    </aside>

    <main class="content">

        <div class="formula-bar">

            <input
                id="cellAddress"
                class="cell-address"
                type="text"
                value="A1"
                readonly
                aria-label="Selected cell address"
            >

            <div class="formula-symbol">
                fx
            </div>

            <input
                id="formulaInput"
                class="formula-input"
                type="text"
                value=""
                placeholder="Enter a value or formula"
                autocomplete="off"
                aria-label="Cell value or formula"
            >

            <button
                id="applyFormulaButton"
                class="formula-apply-button"
                type="button"
                title="Apply value"
            >
                ✓
            </button>

        </div>

        <div class="filters">
            <button class="btn">📅 Time: July 2025</button>
            <button class="btn">🧩 Scenario: Base Case</button>
            <button class="btn">🌍 Region: All</button>
            <button class="btn">+ Add Dimension</button>
        </div>

        <div
            id="hypersheet-grid"
            class="ag-theme-quartz"
        ></div>

    </main>

    <aside class="rightbar">
        <h3>Measures</h3>
    </aside>

</div>

<div class="tabs">
    <div class="tab active-tab">Summary</div>
    <div class="tab">Data Entry</div>
    <div class="tab">Report</div>
    <div class="tab">+</div>
</div>

<script src="/static/js/hypersheet.js"></script>

</body>
</html>
