services:
  postgres:
    image: postgres:16
    container_name: hypersheet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hypersheet
      POSTGRES_USER: hypersheet
      POSTGRES_PASSWORD: hypersheet_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
